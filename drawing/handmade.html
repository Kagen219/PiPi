<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手繪 · Pei-I</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../shared.css">
  <style>
    body{background:#0d0d0d}
    .ex-header{position:fixed;top:0;left:0;right:0;z-index:200;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(0,0,0,0.5);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);}
    .ex-back{color:rgba(255,255,255,0.65);font-size:0.85rem;font-weight:700;text-decoration:none;transition:color 0.2s;}
    .ex-back:hover{color:#fff}
    .ex-title{color:#fff;font-size:0.9rem;font-weight:900}
    .ex-count{color:rgba(255,255,255,0.4);font-size:0.78rem;font-weight:700}
    .ex-hero{padding:100px 2rem 3rem;text-align:center;background:#0d0d0d}
    .ex-emoji{font-size:4rem;margin-bottom:1rem}
    .ex-name{font-size:clamp(2.5rem,6vw,4rem);font-weight:900;color:#fff;letter-spacing:-0.02em;line-height:1.05;margin-bottom:1rem}
    .ex-desc{font-size:1rem;color:rgba(255,255,255,0.45);max-width:480px;margin:0 auto;line-height:1.8}
    .ex-divider{width:40px;height:2px;background:#D4537E;margin:2rem auto;border-radius:999px}
    .empty-state{text-align:center;padding:5rem 2rem;color:rgba(255,255,255,0.3)}
    .empty-emoji{font-size:3rem;margin-bottom:1rem}
    .empty-text{font-size:0.9rem;font-weight:700;letter-spacing:0.05em}
    .ex-grid{max-width:1100px;margin:0 auto;padding:0 1.5rem 6rem;columns:3;column-gap:10px}
    @media(max-width:768px){.ex-grid{columns:2}}
    .ex-item{break-inside:avoid;margin-bottom:10px;border-radius:10px;overflow:hidden;cursor:pointer;position:relative;opacity:0;transform:translateY(30px);transition:opacity 0.5s ease,transform 0.5s ease,box-shadow 0.3s}
    .ex-item.visible{opacity:1;transform:translateY(0)}
    .ex-item:hover{box-shadow:0 0 0 2px #D4537E}
    .ex-item img{width:100%;display:block;border-radius:10px;transition:transform 0.4s}
    .ex-item:hover img{transform:scale(1.03)}
    .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:999;align-items:center;justify-content:center;padding:2rem}
    .lightbox.open{display:flex}
    .lightbox img{max-width:90vw;max-height:90vh;border-radius:10px;object-fit:contain}
    .lb-close{position:absolute;top:1.25rem;right:1.25rem;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:1.4rem;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
  </style>
</head>
<body>
<header class="ex-header">
  <a class="ex-back" href="../index.html#portfolio">← 返回</a>
  <span class="ex-title">手繪</span>
  <span class="ex-count" id="count"></span>
</header>
<div class="ex-hero">
  <div class="ex-emoji">✏️</div>
  <h1 class="ex-name">手繪</h1>
  <p class="ex-desc">待填寫介紹文字</p>
  <div class="ex-divider"></div>
</div>
<div id="main-content">
  <div class="empty-state">
    <div class="empty-emoji">✏️</div>
    <div class="empty-text">圖片整理中，敬請期待</div>
  </div>
</div>
<div class="lightbox" id="lb">
  <button class="lb-close" onclick="closeLb()">✕</button>
  <img id="lb-img" src="" alt="">
</div>
<script>
// 在這裡填入圖片 ID
const ids = ["10SiTSrKFK02a21dZaeV3tDbxKxC26lTS","15x6T4Jindvuu93cS0EzZ5bmviKzF55Ym","1AgDVgaOi9c4sCW1o9e-hwk_FdXiyqtWu","1J1Y3GqBrrusvQ33Mu97Ff_Mu3PHsV1st","1RK3HR2TxdP0BGa2wDc4Gm1rgnFwyENeC","1VcetbNcquLdpdsxNyVeGNt5zdmZGYXeT","1sq3gsMcwScsaW3S2PKAnhVrK1sPOaD13","1K-0PMoVVrxcGMzFXRKZPE9zg0yOFkC5a","1zoPLjGpYd3-3Jq5CD6eubpW3QxmReID9","13xZ-bRQ39yFxlDQhZZmdRMoA7N3TfJJd","17yrtFyNJ3hiYlmhYHOJ3OH_jVvQvFpmf","1PBXgcAGbF8gjFX3-MhPNgZ66KgH1jOtT","1TuUp2IDaC71EfcbiUtrHke-DqlPPEsIU","1Y8eRAlmdXu1Ieh0kwGxlJbipb4eGYGtG","1cHwmbGQyf9cc68xRkixJDqEyeOv2qGUB","1hBVEQkQf2gFljl204WUVhkO7Cub1Gr1A","1ktdQmjTxL1uqkaXVpa_8YncdtBhiuGHN","1pZFZ_RBss0eNULyegR92pkxONss3TFg3","1pyKHk1kf0DqL3O9tQ7fTtvDKRtkIAXKI","12s1kjHe0yIGUR70WUYVsAkctiWEC0HDe","1BNumO5FU_kJPmo7IDypQ8bg-q1l7D9q5","1EO36iudX9Qva0OJif7Vq7Pe0kbY2GZxd","1QHMLUYckCX3wy2Y-ja72WH__PVEAILSV","1VIQKbaJw17aZmD-fWRnU5wUvt_5rFtWg","1YS3Dyk2pu0R1plqY2j3fZarIywAUzRCh","1_heBrfdatZKXg9syWloI_0VIz7idtp1c","1fOOvuWefp6Qd14lJ8wL6Usn4lQcopfsM","1-Wz8cV2Xfibv89nLaWU40SjK_8F-6oPx"];
// 例如：const ids = ["ID1","ID2","ID3"];

if (ids.length > 0) {
  document.getElementById('count').textContent = ids.length + ' 張';
  const grid = document.createElement('div');
  grid.className = 'ex-grid';
  ids.forEach((id,i) => {
    const div = document.createElement('div');
    div.className = 'ex-item';
    const img = document.createElement('img');
    img.src = 'https://lh3.googleusercontent.com/d/' + id;
    img.loading = i < 4 ? 'eager' : 'lazy';
    img.onerror = () => { div.style.display='none'; };
    div.appendChild(img);
    div.onclick = () => openLb('https://lh3.googleusercontent.com/d/' + id);
    grid.appendChild(div);
  });
  document.getElementById('main-content').innerHTML = '';
  document.getElementById('main-content').appendChild(grid);
  const obs = new IntersectionObserver(entries => {
    entries.forEach((e,i) => { if(e.isIntersecting){ setTimeout(()=>e.target.classList.add('visible'),i*60); obs.unobserve(e.target); } });
  },{threshold:0.08});
  document.querySelectorAll('.ex-item').forEach(el => obs.observe(el));
}
function openLb(src){ document.getElementById('lb-img').src=src; document.getElementById('lb').classList.add('open'); }
function closeLb(){ document.getElementById('lb').classList.remove('open'); }
document.getElementById('lb').addEventListener('click',function(e){ if(e.target===this) closeLb(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeLb(); });
</script>
</body>
</html>
